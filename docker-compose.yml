version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: xanh_postgres
    restart: always
    ports:
      - "10000:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0201233
      POSTGRES_DB: xanh_shopify_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: PgAdmin for GUI management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: xanh_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

volumes:
  postgres_data: